# Intraday option-buying agent — configuration.
# Secrets (API key) live in .env, not here.

instrument:
  underlying: NIFTY            # default index. Override per run: ./morning.sh SENSEX  or  ./run.sh run -u BANKNIFTY
  underlying_exchange: NSE_INDEX   # filled in automatically from the underlying (NSE_INDEX/NFO or BSE_INDEX/BFO)
  option_exchange: NFO
  # signal_symbol: NIFTY24NOV26FUT   # optional: use the future (has volume -> true VWAP) for signals
  # signal_exchange: NFO
  expiry: nearest              # nearest | next
  min_days_to_expiry: 0        # 0 = allow expiry-day trading; 1 = skip the expiry day itself
  offset: ATM                  # ATM | OTM1 | ITM1 ...
  product: MIS

strategy:
  name: orb_trend
  candle_interval: 5m
  history_days: 5              # prior days pulled so EMAs are warmed up at the open
  opening_range_minutes: 15    # 09:15–09:30
  entry_start: "09:30"
  entry_end: "14:30"
  ema_fast: 9
  ema_slow: 21
  use_vwap_filter: true
  use_ema_filter: true
  min_range_pct: 0.10          # skip if opening range < 0.10% of price (too quiet)
  max_range_pct: 0.80          # skip if opening range > 0.80% of price (too wild)
  max_extension_pct: 0.50      # do not chase a close more than 0.50% beyond the range (0.30 before the full-body rule)
  min_body_pct: 30             # breakout candle must not be a doji: body >= 30% of its high-low range
  require_direction: true      # green candle for a CE breakout, red candle for a PE breakdown
  min_close_position_pct: 66   # CE: close in the top third of the candle; PE: in the bottom third
  require_full_body_outside: true  # CE: candle must OPEN and close above the range high; PE: open and close below the low
  max_trades_per_day: 2
  max_trades_per_direction: 1
  cooldown_minutes: 10
  underlying_exit: true        # exit if a 5m close comes back through VWAP/slow EMA

risk:
  capital: 100000              # the capital you are allocating to this agent (₹)
  risk_per_trade_pct: 2.0      # ₹2,000 per trade at 1 lakh -> a ₹200 NIFTY premium is tradeable with 1 lot
  max_daily_loss_pct: 4.0      # stop trading for the day after -₹4,000, counted across ALL indices together
  max_lots: 2
  min_lots: 1
  stop_loss_pct: 25            # on the option premium
  target_pct: 50
  breakeven_at_pct: 15         # move stop to entry once premium is +15%
  trail_activate_pct: 20       # start trailing once premium is +20% (was 25; a +24% move gave back everything on 2026-10-28)
  trail_step_pct: 12           # trail 12% below the highest premium seen
  min_premium: 20
  max_premium: 400
  square_off_time: "15:10"

execution:
  strategy_tag: IntradayOptionAgent
  fill_timeout_sec: 20
  exit_retries: 3
  poll_interval_sec: 1.0
  candle_delay_sec: 5
  candle_grace_sec: 20         # broker candle still missing after 20s -> use candles built from live ticks
  ws_stale_sec: 10
  quote_fallback_interval_sec: 2
  allow_live: false            # SAFETY LATCH. Live orders only when OpenAlgo analyzer is OFF *and* this is true.
  live_max_lots: 1             # hard cap on lots while live
  adopt_unknown_positions: false

# Indices ./morning.sh starts when you give it no arguments. Each runs as its own agent with its own
# journal in state/<INDEX>/, its own daily loss limit and its own lots. ./morning.sh NIFTY SENSEX overrides this.
active_underlyings: [NIFTY]

# Per-index overrides, applied on top of the sections above when that index is selected.
# BANKNIFTY and SENSEX ATM premiums are usually 3-5x NIFTY's, so widen the premium window there.
underlyings:
  NIFTY: {}
  BANKNIFTY:
    # monthly-only expiries: ATM premiums run ~₹800-1,100 four weeks out, so with ₹1 lakh capital BANKNIFTY
    # only fits the risk budget in its expiry week. Even OTM10 (1,000 pts out) calls were ₹610 on 28 Oct.
    risk: {min_premium: 50, max_premium: 1200}
  SENSEX:
    risk: {min_premium: 50, max_premium: 1200}

notify:
  telegram_username: ""        # your OpenAlgo Telegram bot username to get trade alerts (optional)

state_dir: state
log_dir: logs
